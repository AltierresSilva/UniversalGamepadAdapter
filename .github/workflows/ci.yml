name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UGA_DRIVER_TESTS: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Tests without driver installation
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=UGA-tests.trx" --results-directory artifacts/test-results
      - name: Publish portable Windows build
        run: dotnet publish src/UGA.App/UGA.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/portable -p:PublishTrimmed=false
      - name: Include documentation
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md artifacts/portable
          Copy-Item docs artifacts/portable/docs -Recurse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: UGA-windows-x64
          path: artifacts/portable/
          retention-days: 14
